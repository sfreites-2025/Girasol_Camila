<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Girasol Especial Para Ti Camila 🌻✨</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- GSAP for UI Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlay UI */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .header {
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: auto;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            font-size: 0.85rem;
            color: #ffd700;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            margin-bottom: 0.5rem;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            background: linear-gradient(135deg, #fff 30%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .footer-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(20px);
        }

        .btn {
            background: rgba(18, 18, 28, 0.65);
            border: 1px solid rgba(255, 215, 0, 0.25);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ff9100);
            color: #000;
            font-weight: 600;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ffe033, #ffa01a);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.4);
        }

        /* Dedicated Card Overlay */
        .card-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 450px;
            background: rgba(12, 12, 20, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255, 215, 0, 0.15);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .card-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-modal h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .card-modal p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .close-card {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-card:hover {
            color: #fff;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .ui-container { padding: 1.2rem; }
            .title { font-size: 2.4rem; }
            .badge { font-size: 0.75rem; }
            .footer-controls { flex-wrap: wrap; }
            .btn { padding: 10px 18px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-container">
        <div class="header" id="header">
            <span class="badge">Un detalle especial</span>
            <h1 class="title">Un Girasol Para Ti</h1>
        </div>

        <div class="footer-controls" id="footer">
            <button class="btn" id="btn-card">
                <i class="fa-solid fa-envelope-open-text"></i> Carta Secreta
            </button>
            <button class="btn btn-primary" id="btn-magic">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Lluvia Estelar
            </button>
        </div>
    </div>

    <!-- Modal de la Carta -->
    <div class="card-modal" id="cardModal">
        <button class="close-card" id="btnCloseCard"><i class="fa-solid fa-xmark"></i></button>
        <h2>Para la chica más bonita ✨</h2>
        <p>
            Dicen que los girasoles buscan siempre la luz del sol para brillar... 
            Bueno, este girasol en 3D lo creé para ti, porque tú eres la persona que ilumina mi día a día. 
            ¡Espero que te saque una bonita sonrisa! 🌻💛
        </p>
        <button class="btn btn-primary" style="margin: 0 auto;" id="btnCloseCard2">
            Guardar con cariño ❤️
        </button>
    </div>

    <script>
        // --- CONFIGURACIÓN DE ESCENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 3;
        controls.maxDistance = 12;
        controls.target.set(0, 1, 0);

        // --- ILUMINACIÓN CÁLIDA Y ROMÁNTICA ---
        const ambientLight = new THREE.AmbientLight(0x1a1528, 1.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffea9f, 2.2);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const rimLight = new THREE.PointLight(0xffaa00, 3, 10);
        rimLight.position.set(-4, 3, -3);
        scene.add(rimLight);

        const centerGlowLight = new THREE.PointLight(0xffd700, 1.5, 4);
        centerGlowLight.position.set(0, 2.2, 0.5);
        scene.add(centerGlowLight);

        // --- FONDO DE ESTRELLAS TITILANTES ---
        function createStarfield() {
            const starCount = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 120;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 120;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 120;
                sizes[i] = Math.random() * 0.08 + 0.02;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.06,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const starField = new THREE.Points(geometry, material);
            scene.add(starField);
            return starField;
        }
        const stars = createStarfield();

        // --- POLEN Y PARTICULAS FLOTANTES ---
        function createFloatingPollen() {
            const count = 600;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const speeds = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 10;
                positions[i * 3 + 1] = Math.random() * 6 - 1;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
                speeds.push({
                    y: Math.random() * 0.005 + 0.002,
                    angle: Math.random() * Math.PI * 2,
                    radius: Math.random() * 0.008
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffd700,
                size: 0.04,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            return { mesh: particles, speeds: speeds };
        }
        const pollen = createFloatingPollen();

        // --- CONSTRUCCIÓN DEL GIRASOL 3D ---
        const sunflowerGroup = new THREE.Group();
        scene.add(sunflowerGroup);

        // 1. Tallo Orgánico Curvado Fino
        const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -2.5, 0),
            new THREE.Vector3(0.15, -1.2, 0.1),
            new THREE.Vector3(-0.1, 0.3, -0.05),
            new THREE.Vector3(0, 1.8, 0)
        ]);

        const stemGeometry = new THREE.TubeGeometry(stemCurve, 64, 0.045, 16, false);
        const stemMaterial = new THREE.MeshStandardMaterial({
            color: 0x2e5a1c,
            roughness: 0.6,
            metalness: 0.1
        });
        const stem = new THREE.Mesh(stemGeometry, stemMaterial);
        stem.castShadow = true;
        stem.receiveShadow = true;
        sunflowerGroup.add(stem);

        // 2. Hojas Finitas del Tallo
        function createLeaf(isLeft) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.quadraticCurveTo(0.4, 0.3, 0.8, 0.1);
            shape.quadraticCurveTo(1.2, -0.2, 1.5, -0.6);
            shape.quadraticCurveTo(0.7, -0.8, 0, 0);

            const extrudeSettings = { depth: 0.01, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.01, bevelThickness: 0.01 };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.center();

            const leafMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a6b24,
                roughness: 0.5,
                side: THREE.DoubleSide
            });

            const leaf = new THREE.Mesh(geometry, leafMaterial);
            leaf.scale.set(0.7, 0.7, 0.7);
            
            if (isLeft) {
                leaf.position.set(-0.25, -0.2, 0);
                leaf.rotation.set(0.2, -0.4, 0.6);
            } else {
                leaf.position.set(0.25, 0.5, 0);
                leaf.rotation.set(-0.2, 0.4, -0.6);
            }
            leaf.castShadow = true;
            return leaf;
        }
        sunflowerGroup.add(createLeaf(true));
        sunflowerGroup.add(createLeaf(false));

        // 3. Cabeza del Girasol (Flor)
        const flowerHeadGroup = new THREE.Group();
        flowerHeadGroup.position.set(0, 1.8, 0.05);
        flowerHeadGroup.rotation.x = 0.25; // Ligera inclinación elegante hacia arriba
        sunflowerGroup.add(flowerHeadGroup);

        // Disco Central (Fibonacci Spiral Florets)
        const centerGeometry = new THREE.CylinderGeometry(0.75, 0.7, 0.12, 32);
        const centerMaterial = new THREE.MeshStandardMaterial({
            color: 0x2b1704,
            roughness: 0.9,
            metalness: 0.1
        });
        const centerDisc = new THREE.Mesh(centerGeometry, centerMaterial);
        centerDisc.rotation.x = Math.PI / 2;
        flowerHeadGroup.add(centerDisc);

        // Detalle Texturizado del Centro
        const pylonGeo = new THREE.SphereGeometry(0.02, 6, 6);
        const pylonMat = new THREE.MeshStandardMaterial({ color: 0x1a0d02, roughness: 0.8 });
        const pylonInstanced = new THREE.InstancedMesh(pylonGeo, pylonMat, 400);

        const dummy = new THREE.Object3D();
        const phi = (1 + Math.sqrt(5)) / 2; // Golden Ratio
        for (let i = 0; i < 400; i++) {
            const r = (Math.sqrt(i) / Math.sqrt(400)) * 0.7;
            const theta = i * 2 * Math.PI / (phi * phi);
            
            dummy.position.set(r * Math.cos(theta), r * Math.sin(theta), 0.06);
            dummy.scale.setScalar(0.8 + Math.random() * 0.4);
            dummy.updateMatrix();
            pylonInstanced.setMatrixAt(i, dummy.matrix);
        }
        flowerHeadGroup.add(pylonInstanced);

        // 4. Pétalos Dorados Perfeccionados
        function createPetalGeometry() {
            const geom = new THREE.BufferGeometry();
            // Geometría curva y fina de un pétalo
            const vertices = new Float32Array([
                0, 0, 0,
                0.12, 0.4, 0.03,
                0.16, 0.9, 0.05,
                0, 1.4, 0.02,
                -0.16, 0.9, 0.05,
                -0.12, 0.4, 0.03
            ]);
            const indices = [
                0, 1, 5,
                1, 2, 4,
                1, 4, 5,
                2, 3, 4
            ];
            geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geom.setIndex(indices);
            geom.computeVertexNormals();
            return geom;
        }

        const petalGeometry = createPetalGeometry();
        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xffb700,
            roughness: 0.35,
            metalness: 0.05,
            side: THREE.DoubleSide
        });

        const petalMaterialInner = new THREE.MeshStandardMaterial({
            color: 0xff9100,
            roughness: 0.4,
            side: THREE.DoubleSide
        });

        // Capa Exterior de Pétalos
        const outerPetalsCount = 34;
        for (let i = 0; i < outerPetalsCount; i++) {
            const angle = (i / outerPetalsCount) * Math.PI * 2;
            const petal = new THREE.Mesh(petalGeometry, petalMaterial);
            
            petal.position.set(Math.cos(angle) * 0.72, Math.sin(angle) * 0.72, 0);
            petal.rotation.z = angle - Math.PI / 2;
            petal.rotation.x = 0.15 + (Math.random() * 0.05); // Ligeramente doblado hacia adelante
            petal.rotation.y = (Math.random() - 0.5) * 0.1;
            petal.scale.set(1, 0.9 + Math.random() * 0.2, 1);
            
            petal.castShadow = true;
            flowerHeadGroup.add(petal);
        }

        // Capa Interior de Pétalos
        const innerPetalsCount = 28;
        for (let i = 0; i < innerPetalsCount; i++) {
            const angle = (i / innerPetalsCount) * Math.PI * 2 + 0.1;
            const petal = new THREE.Mesh(petalGeometry, petalMaterialInner);
            
            petal.position.set(Math.cos(angle) * 0.62, Math.sin(angle) * 0.62, 0.02);
            petal.rotation.z = angle - Math.PI / 2;
            petal.rotation.x = 0.25 + (Math.random() * 0.05);
            petal.scale.set(0.85, 0.8 + Math.random() * 0.15, 0.85);
            
            petal.castShadow = true;
            flowerHeadGroup.add(petal);
        }

        // --- ANIMACIÓN & BUCLE DE RENDERIZADO ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Balanceo suave del girasol (Brisa)
            sunflowerGroup.rotation.z = Math.sin(time * 0.8) * 0.03;
            sunflowerGroup.rotation.x = Math.cos(time * 0.6) * 0.02;

            // Animación de Polen Flotante
            const pos = pollen.mesh.geometry.attributes.position.array;
            for (let i = 0; i < pollen.speeds.length; i++) {
                pos[i * 3 + 1] += pollen.speeds[i].y;
                pos[i * 3] += Math.sin(time + i) * pollen.speeds[i].radius;

                // Reiniciar partículas al llegar arriba
                if (pos[i * 3 + 1] > 5) {
                    pos[i * 3 + 1] = -1;
                }
            }
            pollen.mesh.geometry.attributes.position.needsUpdate = true;

            // Rotación sutil de estrellas
            stars.rotation.y = time * 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- INTERACCIONES DE INTERFAZ ---
        // Animación de entrada
        gsap.to('#header', { opacity: 1, y: 0, duration: 1.2, delay: 0.5, ease: 'power3.out' });
        gsap.to('#footer', { opacity: 1, y: 0, duration: 1.2, delay: 0.8, ease: 'power3.out' });

        // Modal de la Carta
        const cardModal = document.getElementById('cardModal');
        const btnCard = document.getElementById('btn-card');
        const btnClose1 = document.getElementById('btnCloseCard');
        const btnClose2 = document.getElementById('btnCloseCard2');

        function openCard() { cardModal.classList.add('active'); }
        function closeCard() { cardModal.classList.remove('active'); }

        btnCard.addEventListener('click', openCard);
        btnClose1.addEventListener('click', closeCard);
        btnClose2.addEventListener('click', closeCard);

        // Lluvia Estelar / Confeti Dorado
        document.getElementById('btn-magic').addEventListener('click', () => {
            confetti({
                particleCount: 80,
                spread: 100,
                origin: { y: 0.8 },
                colors: ['#ffd700', '#ffa500', '#ffffff', '#ff8c00']
            });

            // Pequeño impulso de luz
            gsap.to(centerGlowLight, { intensity: 4, duration: 0.3, yoyo: true, repeat: 1 });
        });

        // Redimensionamiento Responsivo
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
